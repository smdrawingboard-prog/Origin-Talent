<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}</style></head><body>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--blue);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--blue</b><br><span style="color:var(--ink-soft)">#0349A9</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--blue-dark);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--blue-dark</b><br><span style="color:var(--ink-soft)">#062F73</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--blue-tint);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--blue-tint</b><br><span style="color:var(--ink-soft)">#EFF4FC</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--gold);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--gold</b><br><span style="color:var(--ink-soft)">#C9A227</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--cream);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--cream</b><br><span style="color:var(--ink-soft)">#FBF8F1</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--ink);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--ink</b><br><span style="color:var(--ink-soft)">#1B2233</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--ink-soft);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--ink-soft</b><br><span style="color:var(--ink-soft)">#525B72</span></div></div>
<div style="display:inline-block;margin:0 12px 12px 0;width:130px"><div style="height:70px;border-radius:10px;background:var(--line);border:1px solid var(--line)"></div><div style="font-size:.8rem;margin-top:6px"><b>--line</b><br><span style="color:var(--ink-soft)">#E3E8F2</span></div></div>
</body></html>
